# 备案通过、证书签发之后使用的正式配置。
#
# 部署前把 __DOMAIN__ 替换成真实域名，替换命令见 deploy/README.md。
# 证书文件必须已存在，否则 nginx -t 会失败：先用 master-english.conf
# 跑通 80 端口并签发证书，再切换到本文件。

# 上游连接池，与 `proxy_set_header Connection ""` 配合使用。
# 二者缺一：浏览器的 keep-alive 会被透传给上游而 Nginx 未维护连接池，
# 分块响应可能在结束标记前被截断，页面脚本加载不全从而完全失去交互。
upstream master_english_app {
    server 127.0.0.1:3000;
    keepalive 32;
    keepalive_timeout 60s;
}

# 未匹配到域名的请求一律拒绝，包含直接用公网 IP 访问的情况。
# 备案要求站点通过备案域名访问，因此不让 IP 直接打开站点。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 备案域名的 80 端口：只放行证书续期验证，其余全部跳转 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # max-age 先设短。HSTS 会让浏览器在有效期内强制使用 HTTPS，
    # 证书一旦出问题就无法临时退回 HTTP，稳定运行后再调到 31536000。
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://master_english_app;
        proxy_http_version 1.1;
        # 清空 Connection：使用上游连接池的前提，缺失会导致响应被截断。
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 应用侧限流取 X-Forwarded-For 的最后一跳，这一行必须保留，
        # 否则所有用户会被算作同一个客户端而共用限流额度。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 读超时必须大于应用侧最慢的请求：AI 精读自身超时 60 秒、
        # 前端等到 75 秒，用默认的 60 秒会让慢请求被 Nginx 先切断。
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
