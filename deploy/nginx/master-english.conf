# 测试阶段（公网 IP、纯 HTTP）使用的配置。
# 备案通过、证书签发后改用 master-english-https.conf。

# 上游连接池。必须与下面的 `proxy_set_header Connection ""` 配合使用：
# 声明了 proxy_http_version 1.1 却不清空 Connection 头时，浏览器发来的
# keep-alive 会被透传给上游，而 Nginx 并未维护对应的连接池，连接复用时机
# 错乱会让分块响应在结束标记前被截断，浏览器报 ERR_INCOMPLETE_CHUNKED_ENCODING。
# 后果是 Turbopack 运行时脚本加载不完整，页面完全失去交互。
# 这类故障只在复用连接时出现，用 curl 单次请求测不出来。
upstream master_english_app {
    server 127.0.0.1:3000;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    # 证书签发与续期的验证路径，放在代理之前，避免被转发给应用。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://master_english_app;
        proxy_http_version 1.1;
        # 清空 Connection：使用上游连接池的前提，缺失会导致上述截断问题。
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 应用侧限流取 X-Forwarded-For 的最后一跳，这一行必须保留，
        # 否则所有用户会被算作同一个客户端而共用限流额度。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 读超时必须大于应用侧最慢的请求。AI 精读接口自身超时 60 秒，
        # 前端等到 75 秒，因此这里不能用 Nginx 默认的 60 秒，否则慢一点的
        # AI 请求会被 Nginx 先切断，表现为莫名的 504。
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
